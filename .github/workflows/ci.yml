name: CI

# 日常提交的编译校验：把错误拦在打 tag 之前
# 发版仍由 build.yml（tag 触发）负责
on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时取消上一次仍在跑的校验
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译校验
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查 Android SDK 组件
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
          if [ -d "$SDK_ROOT/platforms/android-34" ] && [ -d "$SDK_ROOT/build-tools/33.0.1" ]; then
            echo "运行器已具备所需组件"
          else
            # 运行器镜像已接受 SDK 许可，仅在缺失时补齐
            SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -n1)"
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;33.0.1"
          fi

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 校验 Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/debug/
