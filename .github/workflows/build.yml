name: Release APK

# 打 tag（v版本号）触发发版
on:
  push:
    tags:
      - 'v*'

# 需要写权限：创建版本分支 + 创建 Release
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码（含全部 tag，用于生成更新说明）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查 Android SDK 组件
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
          if [ -d "$SDK_ROOT/platforms/android-34" ] && [ -d "$SDK_ROOT/build-tools/33.0.1" ]; then
            echo "运行器已具备所需组件"
          else
            # 运行器镜像已接受 SDK 许可，仅在缺失时补齐
            SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -n1)"
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;33.0.1"
          fi

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 读取版本号并校验 tag
        id: version
        run: |
          VERSION=$(grep -m1 -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "未能从 app/build.gradle 读取 versionName" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME 与 build.gradle 的 versionName $VERSION 不一致，请先改版本号" >&2
            exit 1
          fi
          echo "版本号: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 按「项目名_v版本号」重命名 APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          cp "$APK" "dist/ClipDownloader_v${VERSION}.apk"
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipDownloader_v${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: 创建版本分支（该版本 main 快照备份）
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="v${VERSION}"
          git push --force origin "$GITHUB_SHA:refs/heads/$BRANCH"
          echo "已把 $GITHUB_SHA 备份为分支 $BRANCH"

      - name: 创建 Release（更新说明取上一版本以来的提交）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # 上一个版本 tag 作为更新说明的起点
          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "$TAG" | head -n1 || true)

          # 更新说明 = 两版本之间的提交摘要（按提交时间正序）
          {
            echo "## 更新内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --reverse --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG"
            else
              git log --reverse --pretty=format:"- %s (%h)" "$TAG"
            fi
            echo
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明并覆盖安装包"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "ClipDownloader v${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"