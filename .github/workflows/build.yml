name: Build APK

# 推送到 main 或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要写权限，用于把构建产物推送到 v<版本号> 分支
permissions:
  contents: write

# 同一分支上的重复触发取消旧任务，避免产物分支被并发覆盖
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release APK
    # GitHub 托管运行器已预装 Android SDK 与 JDK，直接用 ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查 Android SDK 组件
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"
          if [ -d "$SDK_ROOT/platforms/android-34" ] && [ -d "$SDK_ROOT/build-tools/33.0.1" ]; then
            echo "运行器已具备所需组件"
          else
            # 运行器镜像已接受 SDK 许可，仅在缺失时补齐
            SDKMANAGER="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -n1)"
            "$SDKMANAGER" --install "platforms;android-34" "build-tools;33.0.1"
          fi

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 -o 'versionName[[:space:]]*"[^"]*"' app/build.gradle | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "未能从 app/build.gradle 读取 versionName" >&2
            exit 1
          fi
          echo "版本号: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 按「项目名_v版本号」重命名 APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          cp "$APK" "dist/ClipDownloader_v${VERSION}.apk"
          ls -lh dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ClipDownloader_v${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: 推送到 v版本号 分支
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="v${VERSION}"
          APK="dist/ClipDownloader_v${VERSION}.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 该分支只承载对应版本的构建产物，用 orphan 分支保证内容干净
          cp "$APK" "/tmp/ClipDownloader_v${VERSION}.apk"
          git checkout --orphan "$BRANCH"
          git rm -rf . > /dev/null
          cp "/tmp/ClipDownloader_v${VERSION}.apk" .
          git add -f "ClipDownloader_v${VERSION}.apk"
          git commit -m "build: ClipDownloader v${VERSION}"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git push --force origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          echo "已推送到分支 $BRANCH"